<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libro Verifier</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="/icon.png" alt="" />
        <div>
          <h1>Libro Verifier</h1>
          <p>Human-authored text on this page</p>
        </div>
        <button id="settings" class="icon-button" type="button" title="Settings" aria-label="Settings">⚙</button>
      </header>

      <div id="summary" class="summary" aria-live="polite">Scanning this page…</div>
      <div id="results" class="results"></div>
      <button id="sign" class="primary" type="button">Sign current text</button>

      <footer>
        Verifies readable DOM text and its World Chain registration. Styling, links, images,
        CSS-generated content, and legal identity are not covered.
      </footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
